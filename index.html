<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="运行环境" />
<title>HTML 运行环境</title>
<link rel="icon" href="data:," />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="project-btn" id="projectBtn" aria-label="切换项目">
      <span class="project-name" id="projectName">加载中…</span>
      <span class="caret">▾</span>
    </button>
    <div class="topbar-actions">
      <button class="btn" id="fullBtn">全屏</button>
      <button class="btn primary" id="runBtn">运行</button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane" id="editorPane">
      <div class="tabbar">
        <div class="filetabs" id="fileTabs"></div>
        <button class="addfile" id="addFileBtn" aria-label="新建文件">＋</button>
        <span class="save-hint" id="saveHint">已保存</span>
      </div>
      <div class="editor-area">
        <textarea
          id="editor"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          autocomplete="off"
          aria-label="代码编辑器"
        ></textarea>
        <div class="binary-preview" id="binaryPreview" hidden></div>
      </div>
    </section>

    <section class="pane preview-pane" id="previewPane">
      <div class="frame-host" id="frameHost">
        <div class="blank-hint">空白</div>
      </div>
      <button class="immersive-exit" id="exitBtn" hidden aria-label="退出全屏">✕</button>
    </section>
  </main>

  <div class="viewswitch" id="viewSwitch">
    <button class="active" data-view="code">代码</button>
    <button data-view="preview">预览</button>
  </div>

  <section class="console">
    <div class="console-head" id="consoleHead">
      <span class="console-title">控制台</span>
      <span class="pill" id="logCount" hidden>0</span>
      <span class="pill danger" id="errCount" hidden>0 错误</span>
      <span class="flex-1"></span>
      <button class="link" id="clearBtn">清空</button>
      <span class="chev" id="chev">▸</span>
    </div>
    <div class="console-body" id="consoleBody" hidden>
      <p class="console-empty">还没有输出。代码里的 console.log 和运行错误会显示在这里。</p>
    </div>
  </section>
</div>

<!-- 项目列表 -->
<div class="sheet" id="projectSheet" hidden>
  <div class="sheet-backdrop" data-close="projectSheet"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <span class="sheet-title">项目</span>
      <button class="link" data-close="projectSheet">关闭</button>
    </div>
    <div class="sheet-actions">
      <button class="btn" id="newProjectBtn">＋ 新建</button>
      <button class="btn" id="importBtn">导入 HTML / ZIP</button>
      <input type="file" id="fileInput" accept=".html,.htm,.zip" hidden />
    </div>
    <div class="project-list" id="projectList"></div>
  </div>
</div>

<!-- 项目操作 -->
<div class="sheet" id="actionSheet" hidden>
  <div class="sheet-backdrop" data-close="actionSheet"></div>
  <div class="sheet-panel compact">
    <div class="sheet-head">
      <span class="sheet-title" id="actionTitle">项目</span>
      <button class="link" data-close="actionSheet">取消</button>
    </div>
    <button class="sheet-item" id="renameBtn">重命名</button>
    <button class="sheet-item" id="exportBtn">导出单文件 HTML</button>
    <button class="sheet-item" id="copyHtmlBtn">复制 HTML 代码</button>
    <button class="sheet-item danger" id="deleteBtn">删除项目</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./store.js"></script>
<script src="./app.js"></script>
<script src="./files.js"></script>
<script src="./editor.js"></script>
</body>
</html>
