<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="运行环境" />
<title>HTML 运行环境</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-text">HTML 运行环境</span>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="clearAllBtn">清空</button>
      <button class="btn" id="fullBtn">全屏</button>
      <button class="btn primary" id="runBtn">运行</button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane" id="editorPane">
      <div class="tabbar">
        <button class="tab active" data-tab="html">HTML</button>
        <button class="tab" data-tab="css">CSS</button>
        <button class="tab" data-tab="js">JS</button>
        <span class="save-hint" id="saveHint">空白项目</span>
      </div>
      <textarea
        id="editor"
        spellcheck="false"
        autocapitalize="off"
        autocorrect="off"
        autocomplete="off"
        aria-label="代码编辑器"
      ></textarea>
    </section>

    <section class="pane preview-pane" id="previewPane">
      <div class="frame-host" id="frameHost">
        <div class="blank-hint">空白</div>
      </div>
      <button class="immersive-exit" id="exitBtn" hidden aria-label="退出全屏">✕</button>
    </section>
  </main>

  <div class="viewswitch" id="viewSwitch">
    <button class="active" data-view="code">代码</button>
    <button data-view="preview">预览</button>
  </div>

  <section class="console">
    <div class="console-head" id="consoleHead">
      <span class="console-title">控制台</span>
      <span class="pill" id="logCount" hidden>0</span>
      <span class="pill danger" id="errCount" hidden>0 错误</span>
      <span class="flex-1"></span>
      <button class="link" id="backupBtn">备份</button>
      <button class="link" id="clearBtn">清空</button>
      <span class="chev" id="chev">▸</span>
    </div>
    <div class="console-body" id="consoleBody" hidden>
      <p class="console-empty">还没有输出。代码里的 console.log 和运行错误会显示在这里。</p>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
